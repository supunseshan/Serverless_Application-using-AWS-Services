service: cloudwave-events-backend

frameworkVersion: "3"

useDotenv: true

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 256
  timeout: 30
  logRetentionInDays: 14

  environment:
    STAGE: ${self:provider.stage}
    REGION: ${self:provider.region}
    DATABASE_URL: ${ssm:/cloudwave/${self:provider.stage}/database-url}
    COGNITO_USER_POOL_ID: ${ssm:/cloudwave/${self:provider.stage}/cognito-user-pool-id}
    COGNITO_CLIENT_ID: ${ssm:/cloudwave/${self:provider.stage}/cognito-client-id}
    S3_BUCKET: ${self:custom.s3BucketName}
    CLOUDFRONT_URL: ${ssm:/cloudwave/${self:provider.stage}/cloudfront-url}
    SES_FROM_EMAIL: ${ssm:/cloudwave/${self:provider.stage}/ses-from-email}
    SQS_QUEUE_URL: !Ref RegistrationQueue
    SQS_DLQ_URL: !Ref RegistrationDLQ

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource: "arn:aws:s3:::${self:custom.s3BucketName}/*"
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: "*"
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource: !GetAtt RegistrationQueue.Arn
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:GetParameters
          Resource: "arn:aws:ssm:${self:provider.region}:*:parameter/cloudwave/*"
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"

custom:
  s3BucketName: cloudwave-events-files-${self:provider.stage}
  serverless-offline:
    httpPort: 4000

plugins:
  - serverless-offline
  - serverless-dotenv-plugin

functions:
  # ─── AUTH ───────────────────────────────────────────────────
  syncUser:
    handler: src/functions/auth/syncUser.handler
    events:
      - cognitoUserPool:
          pool: CloudWaveUserPool
          trigger: PostConfirmation

  # ─── EVENTS ─────────────────────────────────────────────────
  createEvent:
    handler: src/functions/events/createEvent.handler
    events:
      - http:
          path: /events
          method: post
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoAuthorizer

  getEvents:
    handler: src/functions/events/getEvents.handler
    events:
      - http:
          path: /events
          method: get
          cors: true

  getEventById:
    handler: src/functions/events/getEventById.handler
    events:
      - http:
          path: /events/{id}
          method: get
          cors: true

  updateEvent:
    handler: src/functions/events/updateEvent.handler
    events:
      - http:
          path: /events/{id}
          method: put
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoAuthorizer

  deleteEvent:
    handler: src/functions/events/deleteEvent.handler
    events:
      - http:
          path: /events/{id}
          method: delete
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoAuthorizer

  # ─── REGISTRATIONS ──────────────────────────────────────────
  registerForEvent:
    handler: src/functions/registrations/registerForEvent.handler
    events:
      - http:
          path: /events/{id}/register
          method: post
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoAuthorizer

  getMyRegistrations:
    handler: src/functions/registrations/getMyRegistrations.handler
    events:
      - http:
          path: /registrations/me
          method: get
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoAuthorizer

  cancelRegistration:
    handler: src/functions/registrations/cancelRegistration.handler
    events:
      - http:
          path: /registrations/{id}/cancel
          method: patch
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoAuthorizer

  # ─── FILES ──────────────────────────────────────────────────
  getPresignedUrl:
    handler: src/functions/files/getPresignedUrl.handler
    events:
      - http:
          path: /files/presigned-url
          method: post
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoAuthorizer

  # ─── NOTIFICATIONS ──────────────────────────────────────────
  processEmailQueue:
    handler: src/functions/notifications/processEmailQueue.handler
    events:
      - sqs:
          arn: !GetAtt RegistrationQueue.Arn
          batchSize: 10

  # ─── QUEUE MONITOR ──────────────────────────────────────────────
  monitorDLQ:
    handler: src/functions/queue/monitorDLQ.handler
    events:
      - schedule:
          rate: rate(1 day)
          enabled: true

  # ─── SCHEDULER ──────────────────────────────────────────────
  sendEventReminders:
    handler: src/functions/scheduler/sendEventReminders.handler
    events:
      - schedule:
          rate: cron(0 9 * * ? *)
          enabled: true

resources:
  Resources:
    # ─── COGNITO ────────────────────────────────────────────────
    CloudWaveUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: cloudwave-user-pool-${self:provider.stage}
        AutoVerifiedAttributes:
          - email
        UsernameAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
        Schema:
          - Name: name
            AttributeDataType: String
            Mutable: true
            Required: true

    CloudWaveUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: cloudwave-client-${self:provider.stage}
        UserPoolId: !Ref CloudWaveUserPool
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
        GenerateSecret: false
        TokenValidityUnits:
          AccessToken: hours
          IdToken: hours
          RefreshToken: days
        AccessTokenValidity: 1
        IdTokenValidity: 1
        RefreshTokenValidity: 30

    # ─── API GATEWAY AUTHORIZER ──────────────────────────────────
    CognitoAuthorizer:
      Type: AWS::ApiGateway::Authorizer
      Properties:
        Name: CognitoAuthorizer
        Type: COGNITO_USER_POOLS
        IdentitySource: method.request.header.Authorization
        RestApiId: !Ref ApiGatewayRestApi
        ProviderARNs:
          - !GetAtt CloudWaveUserPool.Arn

    # ─── S3 BUCKET ───────────────────────────────────────────────
    FilesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.s3BucketName}
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins: ["*"]
              AllowedHeaders: ["*"]
              AllowedMethods: [GET, PUT, POST, DELETE]
              MaxAge: 3000

    # ─── SQS QUEUE ───────────────────────────────────────────────
    RegistrationQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: cloudwave-registration-queue-${self:provider.stage}
        VisibilityTimeout: 60
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt RegistrationDLQ.Arn
          maxReceiveCount: 3

    RegistrationDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: cloudwave-registration-dlq-${self:provider.stage}
        MessageRetentionPeriod: 1209600

  Outputs:
    UserPoolId:
      Value: !Ref CloudWaveUserPool
    UserPoolClientId:
      Value: !Ref CloudWaveUserPoolClient
    ApiGatewayUrl:
      Value: !Sub "https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}"
