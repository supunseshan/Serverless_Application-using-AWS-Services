service: cloudwave-events-backend

frameworkVersion: "3"

package:
  individually: false
  patterns:
    - '!node_modules/@prisma/engines/**'
    - '!node_modules/prisma/**'
    - '!node_modules/serverless/**'
    - '!node_modules/serverless-offline/**'
    - '!node_modules/typescript/**'
    - '!node_modules/ts-node/**'
    - '!test/**'
    - '!.git/**'
    - '!*.md'
    - 'node_modules/.prisma/client/**'
    - 'node_modules/@prisma/client/**'
    
useDotenv: true

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 256
  timeout: 30
  logRetentionInDays: 14

  environment:
    STAGE: ${self:provider.stage}
    REGION: ${self:provider.region}
    DATABASE_URL: ${ssm:/cloudwave/${self:provider.stage}/database-url}
    COGNITO_USER_POOL_ID: ${ssm:/cloudwave/${self:provider.stage}/cognito-user-pool-id}
    COGNITO_CLIENT_ID: ${ssm:/cloudwave/${self:provider.stage}/cognito-client-id}
    S3_BUCKET: cloudwave-events-files-${self:provider.stage}
    CLOUDFRONT_URL: ${ssm:/cloudwave/${self:provider.stage}/cloudfront-url}
    SES_FROM_EMAIL: ${ssm:/cloudwave/${self:provider.stage}/ses-from-email}
    SQS_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/475373052085/cloudwave-registration-queue-${self:provider.stage}
    SQS_DLQ_URL: https://sqs.us-east-1.amazonaws.com/475373052085/cloudwave-registration-dlq-${self:provider.stage}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource: "arn:aws:s3:::cloudwave-events-files-${self:provider.stage}/*"
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: "*"
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource:
            - "arn:aws:sqs:us-east-1:475373052085:cloudwave-registration-queue-${self:provider.stage}"
            - "arn:aws:sqs:us-east-1:475373052085:cloudwave-registration-dlq-${self:provider.stage}"
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:GetParameters
          Resource: "arn:aws:ssm:${self:provider.region}:*:parameter/cloudwave/*"
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"
        - Effect: Allow
          Action:
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminCreateUser
          Resource: "arn:aws:cognito-idp:us-east-1:475373052085:userpool/us-east-1_ALrQWmdek"

custom:
  serverless-offline:
    httpPort: 4000

plugins:
  - serverless-offline
  - serverless-dotenv-plugin

functions:
  # ─── AUTH ───────────────────────────────────────────────────
  syncUser:
    handler: src/functions/auth/syncUser.handler

  # ─── EVENTS ─────────────────────────────────────────────────
  createEvent:
    handler: src/functions/events/createEvent.handler
    events:
      - http:
          path: /events
          method: post
          cors: true
          authorizer:
            name: CognitoAuth
            type: COGNITO_USER_POOLS
            arn: "arn:aws:cognito-idp:us-east-1:475373052085:userpool/us-east-1_ALrQWmdek"

  getEvents:
    handler: src/functions/events/getEvents.handler
    events:
      - http:
          path: /events
          method: get
          cors: true

  getEventById:
    handler: src/functions/events/getEventById.handler
    events:
      - http:
          path: /events/{id}
          method: get
          cors: true

  updateEvent:
    handler: src/functions/events/updateEvent.handler
    events:
      - http:
          path: /events/{id}
          method: put
          cors: true
          authorizer:
            name: CognitoAuth
            type: COGNITO_USER_POOLS
            arn: "arn:aws:cognito-idp:us-east-1:475373052085:userpool/us-east-1_ALrQWmdek"

  deleteEvent:
    handler: src/functions/events/deleteEvent.handler
    events:
      - http:
          path: /events/{id}
          method: delete
          cors: true
          authorizer:
            name: CognitoAuth
            type: COGNITO_USER_POOLS
            arn: "arn:aws:cognito-idp:us-east-1:475373052085:userpool/us-east-1_ALrQWmdek"

  # ─── REGISTRATIONS ──────────────────────────────────────────
  registerForEvent:
    handler: src/functions/registrations/registerForEvent.handler
    events:
      - http:
          path: /events/{id}/register
          method: post
          cors: true
          authorizer:
            name: CognitoAuth
            type: COGNITO_USER_POOLS
            arn: "arn:aws:cognito-idp:us-east-1:475373052085:userpool/us-east-1_ALrQWmdek"

  getMyRegistrations:
    handler: src/functions/registrations/getMyRegistrations.handler
    events:
      - http:
          path: /registrations/me
          method: get
          cors: true
          authorizer:
            name: CognitoAuth
            type: COGNITO_USER_POOLS
            arn: "arn:aws:cognito-idp:us-east-1:475373052085:userpool/us-east-1_ALrQWmdek"

  cancelRegistration:
    handler: src/functions/registrations/cancelRegistration.handler
    events:
      - http:
          path: /registrations/{id}/cancel
          method: patch
          cors: true
          authorizer:
            name: CognitoAuth
            type: COGNITO_USER_POOLS
            arn: "arn:aws:cognito-idp:us-east-1:475373052085:userpool/us-east-1_ALrQWmdek"

  # ─── FILES ──────────────────────────────────────────────────
  getPresignedUrl:
    handler: src/functions/files/getPresignedUrl.handler
    events:
      - http:
          path: /files/presigned-url
          method: post
          cors: true
          authorizer:
            name: CognitoAuth
            type: COGNITO_USER_POOLS
            arn: "arn:aws:cognito-idp:us-east-1:475373052085:userpool/us-east-1_ALrQWmdek"

  # ─── NOTIFICATIONS ──────────────────────────────────────────
  processEmailQueue:
    handler: src/functions/notifications/processEmailQueue.handler
    events:
      - sqs:
          arn: "arn:aws:sqs:us-east-1:475373052085:cloudwave-registration-queue-${self:provider.stage}"
          batchSize: 10

  # ─── QUEUE MONITOR ──────────────────────────────────────────
  monitorDLQ:
    handler: src/functions/queue/monitorDLQ.handler
    events:
      - schedule:
          rate: rate(1 day)
          enabled: true

  # ─── SCHEDULER ──────────────────────────────────────────────
  sendEventReminders:
    handler: src/functions/scheduler/sendEventReminders.handler
    events:
      - schedule:
          rate: cron(0 9 * * ? *)
          enabled: true

resources:
  Outputs:
    ApiGatewayUrl:
      Value: !Sub "https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}"